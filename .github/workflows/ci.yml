name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Check documentation
        run: go run ./cmd/doccheck

      - name: Verify generated code
        run: |
          go generate ./...
          git diff --exit-code

      - name: Test
        run: go test ./...

      - name: Run short fuzz tests
        run: |
          fuzz() {
            local package="$1"
            local target="$2"
            go test -run '^$' -fuzz "^${target}$" -fuzztime=1s "$package"
          }

          fuzz ./tl FuzzDecoderBytes
          fuzz ./tl FuzzDecoderVectorHeader
          fuzz ./tl FuzzDecodeGenerated
          fuzz ./tl FuzzDecodeGeneratedResult
          fuzz ./tl FuzzDecodeGzipPacked
          fuzz ./internal/cryptoutil FuzzAESIGERoundTrip
          fuzz ./internal/cryptoutil FuzzValidateDHParams
          fuzz ./internal/cryptoutil FuzzMessageDerivation
          fuzz ./internal/cryptoutil FuzzFactorPQ
          fuzz ./internal/cryptoutil FuzzEncryptRSAPadded
          fuzz ./internal/mtproto FuzzRouteInboundContainer
          fuzz ./internal/mtproto FuzzDecryptMessage
          fuzz ./internal/transport FuzzReadAbridged
          fuzz ./internal/transport FuzzReadIntermediate
          fuzz ./internal/transport FuzzReadPaddedIntermediate
          fuzz ./internal/transport FuzzReadPlain
          fuzz ./session FuzzDecodeSnapshot
          fuzz ./tgerr FuzzNew

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Compile benchmarks
        run: go test -run '^$' -bench . -benchtime=1x ./...
