name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # --- Fast checks: formatting, docs, generated code ---
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Check documentation
        run: go run ./cmd/doccheck
      - name: Verify generated code
        run: |
          go generate ./...
          git diff --exit-code

  # --- Static analysis ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Staticcheck
        run: staticcheck ./...

  # --- Unit tests: matrix across Go versions ---
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.x"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Test
        run: go test ./...

  # --- Race detector ---
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: true
      - name: Test with race detector
        run: go test -race ./...

  # --- Short fuzz tests ---
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: true
      - name: Run short fuzz tests
        run: |
          set -e
          fuzz() {
            local package="$1"
            local target="$2"
            go test -run '^$' -fuzz "^${target}$" -fuzztime=5s "$package"
          }

          fuzz ./tl FuzzDecoderBytes
          fuzz ./tl FuzzDecoderVectorHeader
          fuzz ./tl FuzzDecodeGenerated
          fuzz ./tl FuzzDecodeGeneratedResult
          fuzz ./tl FuzzDecodeGzipPacked
          fuzz ./internal/cryptoutil FuzzAESIGERoundTrip
          fuzz ./internal/cryptoutil FuzzValidateDHParams
          fuzz ./internal/cryptoutil FuzzMessageDerivation
          fuzz ./internal/cryptoutil FuzzFactorPQ
          fuzz ./internal/cryptoutil FuzzEncryptRSAPadded
          fuzz ./internal/mtproto FuzzRouteInboundContainer
          fuzz ./internal/mtproto FuzzDecryptMessage
          fuzz ./internal/transport FuzzReadAbridged
          fuzz ./internal/transport FuzzReadIntermediate
          fuzz ./internal/transport FuzzReadPaddedIntermediate
          fuzz ./internal/transport FuzzReadPlain
          fuzz ./session FuzzDecodeSnapshot
          fuzz ./tgerr FuzzNew
